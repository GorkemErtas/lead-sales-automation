services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lead_sales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lead_sales"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/lead_sales
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Europe/Istanbul
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api
volumes:
  postgres_data:
  n8n_data:
